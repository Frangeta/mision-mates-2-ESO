<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Misión Mates · 2º ESO</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@600;700&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>:root{color-scheme:light;
--paper:#FAFBFD;--grid:#E3EAF3;--ink:#1D2742;--ink2:#5B6684;--card:#FFFFFF;--line:#DCE3EE;--pen:#2446C7;--penInk:#FFFFFF;
--hy:#FFE45C;--hp:#FF9ACB;--hg:#8AE6BE;--hb:#8FD0FF;--hl:#C4B5FD;--onhl:#1D2742;
--ok:#0F8A57;--okbg:#E5F7EE;--ko:#C9304A;--kobg:#FDECEF;--wr:#8A5A00;--wrbg:#FFF6DB;
--shadow:0 1px 0 var(--line),0 10px 24px -16px rgba(29,39,66,.35);
--hand:"Caveat","Segoe Print","Bradley Hand","Comic Sans MS",cursive;
--body:"Nunito","Avenir Next","Segoe UI",system-ui,-apple-system,sans-serif}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){color-scheme:dark;
--paper:#131A27;--grid:#1C2536;--ink:#ECF1FA;--ink2:#9DA9C4;--card:#1B2434;--line:#2B374C;--pen:#8FA5FF;--penInk:#0F1626;
--hy:#F5D84A;--hp:#F58BBE;--hg:#6FD9AA;--hb:#7CC2F5;--hl:#B3A2F7;
--ok:#5ED6A0;--okbg:#14302A;--ko:#FF8A9C;--kobg:#3A1E28;--wr:#F5C451;--wrbg:#3A3018;--shadow:0 1px 0 var(--line),0 12px 26px -16px rgba(0,0,0,.6)}}
:root[data-theme="dark"]{color-scheme:dark;--paper:#131A27;--grid:#1C2536;--ink:#ECF1FA;--ink2:#9DA9C4;--card:#1B2434;--line:#2B374C;--pen:#8FA5FF;--penInk:#0F1626;--ok:#5ED6A0;--okbg:#14302A;--ko:#FF8A9C;--kobg:#3A1E28;--wr:#F5C451;--wrbg:#3A3018}
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit;-webkit-tap-highlight-color:transparent}
body{margin:0;min-height:100%;color:var(--ink);font:17px/1.5 var(--body);background-color:var(--paper);background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);background-size:24px 24px;background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--pen);outline-offset:2px}
.wrap{max-width:680px;margin:0 auto;padding:18px 16px 110px}
.wrap.prac{padding-bottom:0}
.dock{position:sticky;bottom:0;z-index:5;background:var(--paper);margin:0 -16px;padding:4px 16px calc(10px + env(safe-area-inset-bottom,0px));box-shadow:0 -12px 14px -14px rgba(29,39,66,.45)}
.dock .fbline{margin:4px 4px 8px;min-height:1.4em}
.dock .solbox{max-height:34vh;overflow:auto}
.prac .excard{margin-bottom:10px}
@media (max-height:800px){.k{padding:8px 0;font-size:1.2rem}.ansbox{min-height:56px;margin-bottom:8px}.ansbox.small{min-height:50px}.ans{font-size:1.7rem}.keys{gap:6px}.ptitle{margin-bottom:4px;font-size:.82rem}.excard{padding:12px 14px}.prompt{font-size:.95rem}.rule{font-size:.88rem;padding:6px 10px}.topbar{margin-bottom:6px}}
.hand{font-family:var(--hand);font-weight:700;letter-spacing:.2px;line-height:1.05}
h1.hand{font-size:2.6rem;margin:.1em 0 .15em}h2.hand{font-size:1.9rem;margin:.6em 0 .3em}
.t-b{--tone:var(--hb)}.t-p{--tone:var(--hp)}
.mk{--mc:color-mix(in srgb,var(--tone,var(--hy)) var(--mkp,100%),transparent);background:linear-gradient(transparent 55%,var(--mc) 55%,var(--mc) 90%,transparent 90%);padding:0 .12em;box-decoration-break:clone;-webkit-box-decoration-break:clone}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--mkp:45%}}
:root[data-theme="dark"]{--mkp:45%}
.muted{color:var(--ink2)}.small{font-size:.88rem}.center{text-align:center}
.sub{margin:0;color:var(--ink2)}
.brand{margin:0;font-weight:800;font-size:.85rem;color:var(--pen);letter-spacing:.3px}
/* hero */
.hero{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ring{position:relative;width:84px;height:84px;flex:none;display:grid;place-items:center;text-align:center}
.ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.ring .rbg{fill:var(--card);stroke:var(--line);stroke-width:7}.ring .rfg{fill:none;stroke:var(--hg);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .8s}
.ring b{position:relative;font-size:1.25rem;line-height:1;margin-top:10px}.ring small{position:relative;font-size:.7rem;color:var(--ink2);margin-top:-14px}
.statrow{display:flex;gap:10px;margin:14px 0}
.lvl,.streak{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 14px;box-shadow:var(--shadow)}
.lvl{flex:1}.lvlt{font-size:.95rem}.lvl small{color:var(--ink2);font-size:.78rem}
.xpbar{height:10px;border-radius:6px;background:var(--grid);overflow:hidden;margin:6px 0 3px}.xpbar i{display:block;height:100%;background:var(--pen);border-radius:6px}
.streak{display:flex;flex-direction:column;align-items:center;justify-content:center;min-width:76px}.streak span{font-size:1.3rem;line-height:1}.streak b{font-size:1.3rem;line-height:1.1}.streak small{font-size:.75rem;color:var(--ink2)}
.cta{display:flex;align-items:center;gap:14px;width:100%;text-align:left;border:2px solid var(--ink);background:var(--card);border-radius:18px;padding:14px 16px;box-shadow:4px 4px 0 var(--ink);margin:6px 0 4px;transition:transform .1s,box-shadow .1s}
.cta:active{transform:translate(3px,3px);box-shadow:1px 1px 0 var(--ink)}
.cta .ctaico{font-size:2rem;width:54px;height:54px;display:grid;place-items:center;background:var(--hy);border-radius:50%;flex:none}
.cta span:nth-child(2){flex:1;display:flex;flex-direction:column}.cta small{color:var(--ink2);font-weight:700;font-size:.8rem}.cta b{font-size:1.2rem}.cta em{font-style:normal;color:var(--ink2);font-size:.85rem}
.cta .go{font-size:1.1rem;color:var(--pen)}
/* mundo */
.world{margin-top:18px}
.path{display:flex;flex-direction:column;align-items:center;gap:6px;padding:6px 0 4px}
.node{--d:62px;background:none;border:0;display:flex;flex-direction:column;align-items:center;transform:translateX(calc(var(--off)*42px));padding:4px;max-width:220px}
.node .disc{width:var(--d);height:var(--d);border-radius:50%;display:grid;place-items:center;font-size:1.7rem;background:var(--card);border:3px solid var(--ink);box-shadow:0 4px 0 var(--ink);transition:transform .1s}
.node:active .disc{transform:translateY(3px);box-shadow:0 1px 0 var(--ink)}
.t-b .node.done .disc{background:var(--hb)}.t-p .node.done .disc{background:var(--hp)}
.node.boss .disc{--d:74px;border-radius:22px;background:var(--hy)}
.node.locked .disc{border-style:dashed;border-color:var(--ink2);box-shadow:none;background:transparent;font-size:1.2rem;opacity:.75}
.node.next .disc{outline:4px solid var(--hg);outline-offset:4px}
.node .nt{font-weight:800;font-size:.86rem;margin-top:6px;text-align:center;line-height:1.2;background:var(--paper);padding:0 4px;border-radius:4px}
.node.locked .nt{color:var(--ink2)}
.stars{letter-spacing:1px;font-size:.95rem;color:var(--line)}.stars .on{color:#F2B705}
.foot{text-align:center;color:var(--ink2);font-size:.82rem;margin-top:28px}
/* nav */
.tabs{position:fixed;left:0;right:0;bottom:0;display:flex;justify-content:center;gap:2px;background:var(--card);border-top:1px solid var(--line);padding:6px 6px calc(6px + env(safe-area-inset-bottom,0px));z-index:20}
.tabs button{flex:1;max-width:150px;border:0;background:none;display:flex;flex-direction:column;align-items:center;font-size:.75rem;font-weight:800;color:var(--ink2);padding:4px;border-radius:12px;position:relative}
.tabs button span{font-size:1.35rem;line-height:1.2}.tabs button.on{color:var(--ink);background:var(--grid)}
.tabs em{position:absolute;top:0;right:22%;background:var(--ko);color:#fff;font-style:normal;font-size:.68rem;border-radius:9px;padding:0 6px;line-height:1.5}
/* botones */
.btn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:11px 18px;font-weight:800;box-shadow:0 3px 0 var(--ink);transition:transform .08s,box-shadow .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.btn.pri{background:var(--pen);color:var(--penInk);border-color:var(--pen);box-shadow:0 3px 0 var(--ink)}
.btn.warn{background:var(--kobg);color:var(--ko);border-color:var(--ko);box-shadow:0 3px 0 var(--ko)}
.btn.ghost{border-color:transparent;box-shadow:none;background:none;color:var(--ink2)}
.btn.sm{padding:6px 12px;font-size:.9rem;border-width:1.5px;box-shadow:0 2px 0 var(--ink)}
.btn.wide{width:100%}
.row{display:flex;gap:10px;margin-top:14px}.row>*{flex:1}
.col{display:flex;flex-direction:column;gap:10px;margin-top:18px}
.txt{width:100%;font:700 1.1rem var(--body);padding:12px 14px;border:2px solid var(--ink);border-radius:12px;background:var(--paper);color:var(--ink);margin:6px 0 14px}
.txt.sm{width:auto;max-width:180px;margin:0;padding:6px 10px;font-size:1rem}
.lbl{font-weight:800}
/* modal */
.modal{position:fixed;inset:0;background:rgba(15,20,35,.5);display:flex;align-items:flex-end;justify-content:center;z-index:50;animation:fade .15s}
.sheet{background:var(--card);width:100%;max-width:560px;border-radius:22px 22px 0 0;padding:22px 20px calc(20px + env(safe-area-inset-bottom,0px));max-height:90vh;overflow:auto;animation:up .22s ease-out}
@media (min-width:700px){.modal{align-items:center}.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(40px);opacity:0}}@keyframes fade{from{opacity:0}}
.sh-h{display:flex;gap:14px;align-items:center}.sh-h h2{margin:.05em 0}.sh-h small{color:var(--ink2);font-weight:700}
.disc.big{width:66px;height:66px;border-radius:50%;display:grid;place-items:center;font-size:2rem;border:3px solid var(--ink);flex:none;background:var(--hy)}
.t-b .disc.big{background:var(--hb)}.t-p .disc.big{background:var(--hp)}
/* teoría */
.topbar{display:flex;align-items:center;gap:12px;margin-bottom:10px}
.topbar .x{border:0;background:none;font-size:1.3rem;color:var(--ink2);padding:4px 8px}
.topbar .tt{flex:1;font-size:1.5rem}
.tcard{position:relative;background:var(--card);border:1px solid var(--line);border-radius:6px 16px 14px 18px;padding:26px 20px 20px;box-shadow:var(--shadow);margin-top:14px}
.tape{position:absolute;top:-12px;left:50%;width:110px;height:24px;transform:translateX(-50%) rotate(-3deg);background:var(--hy);opacity:.75;border-radius:2px}
.t-b .tape{background:var(--hb)}.t-p .tape{background:var(--hp)}
.tcard h2{margin-top:.1em}.tb{font-size:1.05rem}
.dots{display:flex;justify-content:center;gap:6px;margin:14px 0 0}.dots i{width:8px;height:8px;border-radius:50%;background:var(--line)}.dots i.on{background:var(--pen);width:22px;border-radius:4px}
.ladder{padding-left:1.4em;margin:.4em 0}.ladder li{margin:.35em 0}
.abn,.ojo{border-radius:10px;padding:10px 12px;margin:12px 0 4px;font-size:.98rem}
.abn{background:color-mix(in srgb,var(--hg) 35%,transparent);border-left:5px solid var(--hg)}
.ojo{background:color-mix(in srgb,var(--hp) 30%,transparent);border-left:5px solid var(--hp)}
.abn b,.ojo b{display:block;font-size:.85rem}
/* matemáticas */
.m,.mline,.big,.big2{font-variant-numeric:tabular-nums;font-weight:800}
.mline{display:block;text-align:center;font-size:1.35rem;line-height:2.3;margin:8px 0;overflow-x:auto;overflow-y:hidden}
.big{font-size:1.8rem;text-align:center;margin:8px 0}.big2{font-size:1.55rem}
.fr{display:inline-flex;flex-direction:column;align-items:center;vertical-align:middle;line-height:1.1;margin:0 .1em;font-size:.85em}
.fr>span{padding:0 .2em;min-width:.8em;text-align:center}.fr>span:first-child{border-bottom:2px solid currentColor}
.num{white-space:nowrap;display:inline-flex;align-items:center}
.op{margin:0 .3em;font-weight:700}.pa{font-weight:500;color:var(--ink2)}
.mline .pa{font-size:1.15em}
sup{font-size:.6em;vertical-align:super;line-height:0}
.pw{white-space:nowrap}
.rt{display:inline-flex;align-items:flex-start}.rs{font-weight:500}.rad{border-top:2px solid currentColor;padding:0 .15em;margin-top:.15em}
.hl{background-image:linear-gradient(var(--hy),var(--hy));background-repeat:no-repeat;background-size:100% 100%;color:var(--onhl);border-radius:.25em .6em .3em .5em;padding:.05em .15em;box-decoration-break:clone;-webkit-box-decoration-break:clone;animation:swipe .5s ease-out both}
.hl .pa{color:var(--onhl);opacity:.7}
@keyframes swipe{from{background-size:0% 100%}}
.quote{font-size:1.15rem;font-weight:700;margin:10px 0;padding:10px 14px;border-left:4px solid var(--hb);background:var(--paper);border-radius:8px}
table.rej{border-collapse:collapse;margin:10px auto;font-size:.98rem;max-width:100%}
.rej th,.rej td{border:1.5px solid var(--line);padding:6px 10px;text-align:center;vertical-align:middle}
.rej th{background:var(--grid);font-weight:800;text-align:left}
.figwrap{display:flex;justify-content:center;margin:10px 0}
svg.nl{width:100%;max-width:520px}svg.nl .ax{stroke:var(--ink);stroke-width:2}svg.nl .tk{stroke:var(--ink);stroke-width:1.5}svg.nl .tl{font:700 12px var(--body);fill:var(--ink2);text-anchor:middle}
svg.nl .mk0{fill:var(--hp);stroke:var(--ink);stroke-width:1.5}svg.nl .mk1{fill:var(--hb);stroke:var(--ink);stroke-width:1.5}svg.nl .ml{font:800 13px var(--body);fill:var(--ink);text-anchor:middle}
svg.fig{width:180px;max-width:60%}svg.fig rect,svg.fig path{stroke:var(--ink);stroke-width:2}svg.fig .on{fill:var(--hp)}svg.fig .off{fill:var(--card)}
svg.bar{width:100%;max-width:560px}svg.bar rect{stroke:var(--ink);stroke-width:1.5}svg.bar .b0{fill:var(--hb)}svg.bar .b1{fill:var(--hp)}svg.bar .b2{fill:var(--hg)}svg.bar .b3{fill:var(--hy)}svg.bar .bl{font:800 14px var(--body);fill:var(--ink);text-anchor:middle}
/* práctica */
.prog{flex:1;height:14px;background:var(--grid);border-radius:8px;overflow:hidden;border:1.5px solid var(--line)}.prog i{display:block;height:100%;background:var(--hg);transition:width .4s}
.prog.timer i{background:var(--hp);transition:none}
.combo{font-weight:900;font-size:.95rem;color:var(--ink2);min-width:46px;text-align:right}.combo.hot{color:var(--ko)}
.ptitle{margin:0 0 8px;font-weight:800;color:var(--ink2);font-size:.9rem}
.excard{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;box-shadow:var(--shadow)}
.excard.shk{animation:shk .35s}
@keyframes shk{20%{transform:translateX(-8px)}40%{transform:translateX(7px)}60%{transform:translateX(-5px)}80%{transform:translateX(3px)}}
.prompt{margin:0 0 6px;font-weight:700}
.hints{margin-top:10px}.hint{background:color-mix(in srgb,var(--hy) 28%,var(--card));border-radius:10px;padding:8px 12px;margin-top:8px;font-size:.97rem}.hint>.hn{display:block;font-size:.8rem;font-weight:800;color:var(--wr)}
.hrow{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.fbline{min-height:1.6em;margin:10px 4px;font-weight:700;font-size:.97rem}
.fbline.good{color:var(--ok)}.fbline.bad{color:var(--ko)}.fbline.warn{color:var(--wr)}
.ansbox{display:flex;align-items:center;justify-content:center;gap:8px;background:var(--card);border:2px solid var(--ink);border-radius:14px;min-height:74px;margin-bottom:10px;padding:6px}
.ansbox.small{min-height:62px}
.ans{font-size:2rem;font-weight:900;font-variant-numeric:tabular-nums}.ans .ph{color:var(--line)}
.ans .fr{font-size:.8em}
.cur{display:inline-block;width:2px;height:1em;background:var(--pen);vertical-align:middle;animation:blink 1s steps(1) infinite}@keyframes blink{50%{opacity:0}}
.unit{font-weight:800;color:var(--ink2)}
.keys{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.k{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:12px 0;font-size:1.35rem;font-weight:900;box-shadow:0 3px 0 var(--ink)}
.k:active{transform:translateY(2px);box-shadow:0 1px 0 var(--ink)}
.k.fn{background:var(--grid);font-size:1.1rem}.k:disabled{opacity:.3}
.k[data-k="0"]{grid-column:span 2}.k.ok{grid-column:span 2;background:var(--pen);color:var(--penInk);border-color:var(--pen);font-size:1.05rem;box-shadow:0 3px 0 var(--ink)}
.opts{display:flex;flex-direction:column;gap:8px;margin-top:10px}.opts.inline{flex-direction:row;justify-content:center}.opts.inline .opt{min-width:72px;font-size:1.5rem}
.opt{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:12px 14px;font-weight:800;font-size:1.05rem;box-shadow:0 3px 0 var(--ink);text-align:center}
.opt.yes{background:var(--okbg);border-color:var(--ok);color:var(--ok);box-shadow:0 3px 0 var(--ok)}.opt.no{opacity:.45;text-decoration:line-through;box-shadow:none}
.slots{display:flex;flex-wrap:wrap;align-items:center;justify-content:center;gap:4px;margin:12px 0}
.slot{min-width:58px;min-height:52px;border:2px dashed var(--ink2);border-radius:10px;background:var(--paper);font-weight:900;font-size:1.15rem;color:var(--ink2)}
.slot.full{border-style:solid;border-color:var(--ink);color:var(--ink);background:var(--hy)}
.lt{font-weight:900;color:var(--ink2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chipn{border:2px solid var(--ink);background:var(--card);border-radius:12px;padding:8px 14px;font-weight:900;font-size:1.2rem;box-shadow:0 3px 0 var(--ink)}.chipn.used{opacity:.25;box-shadow:none}
.notebook{max-height:42vh;overflow:auto;padding:4px 2px}
.nl2{text-align:center;font-weight:800;font-size:1.3rem;line-height:2.3;overflow-x:auto;overflow-y:hidden}
.nl2.past{opacity:.5;font-size:1.05rem;line-height:2.1}.nl2.past .hl{animation:none;color:inherit;background-image:linear-gradient(color-mix(in srgb,var(--hy) 40%,transparent),color-mix(in srgb,var(--hy) 40%,transparent))}.nl2.past .hl .pa{color:var(--ink2)}
.nl2.res{font-size:1.8rem;color:var(--ok)}
.eq{color:var(--ink2);margin-right:.4em;font-weight:700}
.rule{display:flex;gap:10px;align-items:flex-start;background:var(--paper);border:1.5px dashed var(--line);border-radius:12px;padding:8px 12px;margin-top:10px;font-size:.95rem}
.rule .ri{font-size:1.3rem;line-height:1.2}.rule small{color:var(--ink2)}
.story{font-size:1.05rem;font-weight:600}
.data{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}.data b{font-size:.8rem;color:var(--ink2);margin-right:4px}
.data>span{background:var(--grid);border-radius:8px;padding:2px 10px;font-weight:700;font-size:.93rem}
.parts{list-style:none;padding:0;margin:12px 0 0;counter-reset:p}
.parts li{counter-increment:p;padding:8px 10px 8px 40px;position:relative;border-radius:10px;margin-top:6px}
.parts li::before{content:counter(p);position:absolute;left:8px;top:8px;width:24px;height:24px;border-radius:50%;display:grid;place-items:center;font-weight:900;font-size:.85rem;background:var(--grid)}
.parts .pdone{background:var(--okbg);display:flex;justify-content:space-between;gap:10px;align-items:center}.parts .pdone::before{content:"✓";background:var(--ok);color:var(--card)}
.parts .pdone b{color:var(--ok);white-space:nowrap}
.parts .pnow{background:color-mix(in srgb,var(--hy) 30%,transparent);font-weight:700}
.panel{border-radius:16px;padding:16px;border:2px solid;animation:up .2s ease-out}
.panel.good{background:var(--okbg);border-color:var(--ok)}.panel.bad{background:var(--kobg);border-color:var(--ko)}
.ph1{display:flex;justify-content:space-between;align-items:center;font-size:1.25rem}.panel.good .ph1 b{color:var(--ok)}.panel.bad .ph1 b{color:var(--ko)}
.xp{background:var(--hy);color:var(--onhl);font-weight:900;border-radius:8px;padding:2px 10px;font-size:1rem}
.panel p{margin:6px 0}.panel details{margin:8px 0 12px}.panel summary{font-weight:800;cursor:pointer}
.solbox{background:var(--card);border-radius:10px;padding:8px;margin-top:8px;overflow-x:auto}

.rstats{display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:16px 0}
.rstats div{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:10px 16px;text-align:center;min-width:90px;box-shadow:var(--shadow)}

.badgewin{display:flex;gap:12px;align-items:center;background:var(--card);border:2px solid var(--ink);border-radius:14px;padding:10px 14px;margin:10px 0}.badgewin>span{font-size:2rem}.badgewin small{display:block;color:var(--ink2)}
.lvup{width:92px;height:92px;margin:0 auto;border-radius:50%;background:var(--hy);border:3px solid var(--ink);display:grid;place-items:center;font:700 3rem var(--hand);color:var(--onhl)}
.bgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.bdg{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:12px;text-align:center;opacity:.6}
.bdg.on{opacity:1;border:2px solid var(--ink);box-shadow:0 3px 0 var(--ink)}.bdg span{font-size:2rem;display:block}.bdg b{display:block;font-size:.95rem}.bdg small{color:var(--ink2);font-size:.78rem}
.settings{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:6px 14px 14px}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:10px 0;border-bottom:1px solid var(--line);font-weight:700}.setrow small{display:block;font-weight:600;color:var(--ink2);font-size:.8rem}
.setrow input[type=checkbox]{width:22px;height:22px;accent-color:var(--pen)}
.settings .btn{margin-top:14px}
.empty{background:var(--card);border:1px dashed var(--line);border-radius:14px;padding:18px;text-align:center}
.mlist{color:var(--ink2);padding-left:1.2em}
/* toast, confeti */
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:12px;font-weight:700;z-index:60;transition:opacity .3s;max-width:90vw;text-align:center}.toast.out{opacity:0}
.confetti{position:fixed;inset:0;pointer-events:none;z-index:70;overflow:hidden}
.confetti i{position:absolute;top:-20px;height:14px;border-radius:2px;animation:fall 2.2s ease-in forwards}
@keyframes fall{to{top:105vh;transform:rotate(720deg) translateX(40px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (max-width:420px){h1.hand{font-size:2.2rem}.mline,.nl2{font-size:1.15rem}.big2{font-size:1.3rem}.node{transform:translateX(calc(var(--off)*30px))}.k{padding:10px 0}.ansbox{min-height:62px}}

/* asistente de denominador común */
.lcd{margin-top:12px;border:2px solid var(--ink);border-radius:14px;background:var(--paper);padding:10px 12px;box-shadow:0 3px 0 var(--ink)}
.lcdh{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:900;font-size:.95rem;margin-bottom:4px}

.lrow{display:flex;align-items:center;gap:10px;padding:6px 4px;border-radius:10px;font-weight:800;font-size:1.15rem;flex-wrap:wrap}
.lrow .lt2{font-size:.78rem;font-weight:800;color:var(--ink2);min-width:100%;margin-bottom:-4px}
.lrow.done{opacity:.75}.lrow.done .okv{color:var(--ok)}
.lrow.now{background:color-mix(in srgb,var(--hy) 35%,transparent)}
.qbox{display:inline-grid;place-items:center;min-width:1.8em;height:1.5em;padding:0 .2em;border:2px dashed var(--ink);border-radius:6px;background:var(--card);color:var(--ink2)}
.lrow.now .qbox{border-style:solid;border-color:var(--pen);color:var(--pen);animation:pulse 1.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 4px color-mix(in srgb,var(--pen) 25%,transparent)}}
.okv{font-variant-numeric:tabular-nums}
.hit{background:var(--hy);color:var(--onhl);border-radius:4px;padding:0 3px;font-weight:900}
.rej td.l{text-align:left;font-weight:600}
.lcdbtn{margin-top:10px}
</style></head>
<body><div id="app"></div>
<script>
/* ================== MOTOR MATEMÁTICO ================== */
const R=(a,b)=>a+Math.floor(Math.random()*(b-a+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const shuffle=a=>{a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;};
const gcd=(a,b)=>{a=Math.abs(a);b=Math.abs(b);while(b){[a,b]=[b,a%b];}return a;};
const lcm=(a,b)=>Math.abs(a*b)/gcd(a,b);
const lcmA=arr=>arr.reduce((x,y)=>lcm(x,y),1);
const nz=(a,b)=>{let x;do{x=R(a,b);}while(x===0);return x;};
const sgn=()=>Math.random()<.5?-1:1;
const uid=()=>Math.random().toString(36).slice(2,9);
const clone=o=>JSON.parse(JSON.stringify(o));
const uniq=a=>[...new Set(a)];
const divisors=n=>{n=Math.abs(n);const d=[];for(let i=1;i<=n;i++)if(n%i===0)d.push(i);return d;};

/* fracciones como {n,d} */
const Q=(n,d=1)=>{if(d===0)throw new Error('div0');if(d<0){n=-n;d=-d;}return{n,d};};
const red=x=>{const g=gcd(x.n,x.d)||1;return Q(x.n/g,x.d/g);};
const add=(a,b)=>red(Q(a.n*b.d+b.n*a.d,a.d*b.d));
const sub=(a,b)=>add(a,Q(-b.n,b.d));
const mul=(a,b)=>red(Q(a.n*b.n,a.d*b.d));
const dvd=(a,b)=>{if(b.n===0)throw new Error('div0');return red(Q(a.n*b.d,a.d*b.n));};
const pw=(a,e)=>red(Q(a.n**e,a.d**e));
const neg=x=>Q(-x.n,x.d);
const absQ=x=>Q(Math.abs(x.n),x.d);
const eqQ=(a,b)=>a.n*b.d===b.n*a.d;
const ltQ=(a,b)=>a.n*b.d<b.n*a.d;
const isRed=x=>gcd(x.n,x.d)===1;
const qv=x=>x.n/x.d;
const rf=(dens,max=7)=>{let d,n;do{d=pick(dens);n=R(1,max);}while(gcd(n,d)!==1||d===1);return Q(n,d);};
const niceQ=(x,md=120,mn=400)=>Math.abs(x.d)<=md&&Math.abs(x.n)<=mn;

/* texto y html */
const M='−';
const ns=n=>(n<0?M:'')+Math.abs(n);
const qT=x=>{x=x;return x.d===1?ns(x.n):ns(x.n)+'/'+x.d;};
function qH(x,paren,plus){
  const ng=x.n<0,a=Math.abs(x.n);
  const core=x.d===1?`${a}`:`<span class="fr"><span>${a}</span><span>${x.d}</span></span>`;
  const sign=ng?M:(plus?'+':'');
  const s=`<span class="num">${sign}${core}</span>`;
  return (paren&&(ng||plus))?`<span class="pa">(</span>${s}<span class="pa">)</span>`:s;
}
const fH=(n,d)=>qH(Q(n,d));            // fracción "tal cual" (sin reducir)
const fR=(n,d)=>`<span class="num"><span class="fr"><span>${n}</span><span>${d}</span></span></span>`; // literal
const mth=h=>`<span class="m">${h}</span>`;

/* ===== árbol de expresiones ===== */
const N=(v,o={})=>({t:'n',id:uid(),v:typeof v==='number'?Q(v):v,p:!!o.p});
const S=(...ts)=>({t:'s',id:uid(),terms:ts.map(([s,n])=>({s,n}))});
const P=(first,...rest)=>({t:'p',id:uid(),terms:[{op:'·',n:first},...rest.map(([op,n])=>({op,n}))]});
const G=(e,k='(')=>({t:'g',id:uid(),k,e});
const W=(b,e)=>({t:'w',id:uid(),b,e});
const RT=e=>({t:'r',id:uid(),e});
const Nq=(n,d=1,o)=>N(Q(n,d),o);

function rd(n,ctx='top',hl=null){
  let h;
  switch(n.t){
    case 'n':{const needP=(ctx==='sum'||ctx==='prod')?(n.v.n<0||n.p):(ctx==='first'?n.p:false);h=qH(n.v,needP,n.p);break;}
    case 's':h=n.terms.map((t,i)=>{const op=i===0?(t.s<0?`<span class="op">${M}</span>`:''):`<span class="op">${t.s<0?M:'+'}</span>`;const c=(i===0&&t.s>0)?'first':'sum';return op+rd(t.n,c,hl);}).join('');break;
    case 'p':{const parts=n.terms.map((t,i)=>(i?`<span class="op">${t.op}</span>`:'')+rd(t.n,'prod',hl));
      if(hl&&hl.id===n.id&&hl.pair&&n.terms.length>2)return `<span class="hl">${parts[0]}${parts[1]}</span>`+parts.slice(2).join('');
      h=parts.join('');break;}
    case 'g':{const[o,c]=n.k==='['?['[',']']:['(',')'];h=`<span class="pa">${o}</span>${rd(n.e,'top',hl)}<span class="pa">${c}</span>`;break;}
    case 'w':{let b;if(n.b.t==='n'){const f=n.b.v.n<0||n.b.v.d!==1;b=f?`<span class="pa">(</span>${qH(n.b.v)}<span class="pa">)</span>`:qH(n.b.v);}else b=rd(n.b,'top',hl);h=`<span class="pw">${b}<sup>${n.e}</sup></span>`;break;}
    case 'h':h=n.html;break;
    case 'r':h=`<span class="rt"><span class="rs">√</span><span class="rad">${rd(n.e,'top',hl)}</span></span>`;break;
  }
  if(hl&&hl.id===n.id)h=`<span class="hl">${h}</span>`;
  return h;
}
function ev(n){
  switch(n.t){
    case 'n':return n.v;
    case 's':return n.terms.reduce((a,t)=>add(a,t.s<0?neg(ev(t.n)):ev(t.n)),Q(0));
    case 'p':return n.terms.slice(1).reduce((a,t)=>t.op==='·'?mul(a,ev(t.n)):dvd(a,ev(t.n)),ev(n.terms[0].n));
    case 'g':return ev(n.e);
    case 'w':return pw(ev(n.b),n.e);
    case 'r':{const v=ev(n.e);const k=Math.round(Math.sqrt(v.n));if(v.d!==1||k*k!==v.n)throw new Error('raiz');return Q(k);}
  }
}
function cands(n,depth,out){
  switch(n.t){
    case 's':if(n.terms.every(t=>t.n.t==='n'))out.push({node:n,depth,pri:1,kind:'sum'});else n.terms.forEach(t=>cands(t.n,depth,out));break;
    case 'p':if(n.terms[0].n.t==='n'&&n.terms[1].n.t==='n')out.push({node:n,depth,pri:2,kind:'prod'});n.terms.forEach(t=>cands(t.n,depth,out));break;
    case 'g':cands(n.e,depth+1,out);break;
    case 'w':if(n.b.t==='n')out.push({node:n,depth,pri:3,kind:'pow'});else cands(n.b,depth,out);break;
    case 'r':if(n.e.t==='n')out.push({node:n,depth:depth+1,pri:3,kind:'root'});else cands(n.e,depth+1,out);break;
  }
}
function best(root){const out=[];cands(root,0,out);out.forEach((c,i)=>c.i=i);out.sort((a,b)=>b.depth-a.depth||b.pri-a.pri||a.i-b.i);return out[0]||null;}
function stepVal(c){if(c.kind==='prod'){const t=c.node.terms;return t[1].op==='·'?mul(t[0].n.v,t[1].n.v):dvd(t[0].n.v,t[1].n.v);}return ev(c.node);}
function hlOf(c){return{id:c.node.id,pair:c.kind==='prod'&&c.node.terms.length>2};}
function norm(n){
  switch(n.t){
    case 's':return{...n,terms:n.terms.map(t=>({s:t.s,n:norm(t.n)}))};
    case 'p':{const m={...n,terms:n.terms.map(t=>({op:t.op,n:norm(t.n)}))};return m.terms.length===1?m.terms[0].n:m;}
    case 'g':{const e=norm(n.e);return e.t==='n'?e:{...n,e};}
    case 'w':return{...n,b:norm(n.b)};
    case 'r':return{...n,e:norm(n.e)};
    default:return n;
  }
}
function apply(root,c){
  const v=stepVal(c),id=c.node.id;
  const rep=n=>{
    if(n.id===id){if(c.kind==='prod'&&n.terms.length>2)return{...n,terms:[{op:'·',n:N(v)},...n.terms.slice(2)]};return N(v);}
    switch(n.t){
      case 's':return{...n,terms:n.terms.map(t=>({s:t.s,n:rep(t.n)}))};
      case 'p':return{...n,terms:n.terms.map(t=>({op:t.op,n:rep(t.n)}))};
      case 'g':return{...n,e:rep(n.e)};
      case 'w':return{...n,b:rep(n.b)};
      case 'r':return{...n,e:rep(n.e)};
      default:return n;
    }
  };
  return norm(rep(root));
}
function allSteps(ast){let cur=norm(clone(ast));const st=[];let g=0;while(cur.t!=='n'&&g++<60){const c=best(cur);if(!c)break;st.push({c,before:cur,val:stepVal(c)});cur=apply(cur,c);}return{steps:st,result:cur};}
function solLines(ast){const{steps,result}=allSteps(ast);return[...steps.map(s=>rd(s.before,'top',hlOf(s.c))),rd(result)];}
function solHTML(ast){return `<div class="sol">${solLines(ast).map((l,i)=>`<div class="sl">${i?'<span class="eq">=</span>':''}${l}</div>`).join('')}</div>`;}
function checkNice(ast,md=144,mn=500){const{steps,result}=allSteps(ast);for(const s of steps){if(!niceQ(s.val,md,mn))return false;}return niceQ(result.v,md,mn);}
function hasFrac(n){if(n.t==='n')return n.v.d!==1;if(n.t==='s'||n.t==='p')return n.terms.some(t=>hasFrac(t.n));if(n.t==='g')return hasFrac(n.e);if(n.t==='w')return hasFrac(n.b);if(n.t==='r')return hasFrac(n.e);return false;}

/* ===== pistas ABN por paso ===== */
const tbl=rows=>`<table class="rej">${rows.map(r=>`<tr>${r.map((c,i)=>i===0?`<th>${c}</th>`:`<td>${c}</td>`).join('')}</tr>`).join('')}</table>`;
function sumVals(node){return node.terms.map(t=>t.s<0?neg(t.n.v):t.n.v);}
function sumHints(node){
  const vals=sumVals(node);
  const dbl=node.terms.some(t=>t.n.v.n<0||t.n.p);
  const rew=vals.map((v,i)=>`<span class="op">${v.n<0?M:(i?'+':'')}</span>${qH(absQ(v))}`).join('');
  if(vals.every(v=>v.d===1)){
    const pos=vals.filter(v=>v.n>0).map(v=>v.n),ng=vals.filter(v=>v.n<0).map(v=>-v.n);
    const sp=pos.reduce((a,b)=>a+b,0),sn=ng.reduce((a,b)=>a+b,0);
    const h1=(dbl?`Primero quita los dobles signos (<b>− (−a) = +a</b>, <b>+ (−a) = −a</b>, <b>− (+a) = −a</b>):<div class="mline">${rew}</div>`:'')+`Truco ABN: piensa en dinero. Lo positivo es lo que <b>ganas</b> y lo negativo lo que <b>pierdes</b>. Júntalos por separado.`;
    const h2=tbl([['Gano (+)',pos.length?pos.join(' + ')+' = <b>'+sp+'</b>':'0'],['Pierdo (−)',ng.length?ng.join(' + ')+' = <b>'+sn+'</b>':'0'],['¿Quién gana?',sp>=sn?`Gano más que pierdo → resultado <b>positivo</b>: ${sp} − ${sn}`:`Pierdo más que gano → resultado <b>negativo</b>: −(${sn} − ${sp})`]]);
    return[h1,h2];
  }
  const dens=vals.map(v=>v.d),L=lcmA(dens);
  const h1=(dbl?`Quita los dobles signos:<div class="mline">${rew}</div>`:'')+`Necesitas un <b>denominador común</b>: m.c.m.(${uniq(dens).join(', ')}) = <b>${L}</b>. Si hay un entero, piensa que su denominador es 1.`;
  const rows=[['Fracción','¿× cuánto?','Equivalente']].concat(vals.map(v=>[qH(v),`× ${L/v.d}`,fR((v.n<0?M:'')+Math.abs(v.n*L/v.d),L)]));
  const nums=vals.map((v,i)=>(v.n<0?` ${M} `:(i?' + ':''))+Math.abs(v.n*L/v.d)).join('');
  const h2=`<table class="rej">${rows.map((r,i)=>`<tr>${r.map(c=>i?`<td>${c}</td>`:`<th>${c}</th>`).join('')}</tr>`).join('')}</table>Ahora opera solo los numeradores y deja el ${L} abajo: ${fR(nums,L)}`;
  return[h1,h2];
}
const sgS=x=>x.n<0?M:'+';
function prodHints(c){
  const t=c.node.terms,a=t[0].n.v,b=t[1].n.v,op=t[1].op,r=stepVal(c);
  const rule=`Regla de los signos: <b>(${sgS(a)}) ${op} (${sgS(b)}) = (${sgS(r)})</b>. Signos iguales → +, signos distintos → −.`;
  if(a.d===1&&b.d===1)return[rule,`Calcula sin signos: <b>${Math.abs(a.n)} ${op} ${Math.abs(b.n)}</b> y ponle el signo <b>${sgS(r)}</b>.`];
  if(op==='·')return[rule+' Para multiplicar fracciones: <b>numerador por numerador</b> y <b>denominador por denominador</b>.',`Queda ${fR(Math.abs(a.n)+'·'+Math.abs(b.n),a.d+'·'+b.d)}. Truco: simplifica antes de multiplicar si un número de arriba y otro de abajo tienen un divisor común.`];
  return[rule+` Dividir es <b>multiplicar por la inversa</b>: dale la vuelta a la segunda: ${qH(absQ(a))} · ${fR(b.d,Math.abs(b.n))}`,`Queda ${fR(Math.abs(a.n)+'·'+b.d,a.d+'·'+Math.abs(b.n))}. Después simplifica.`];
}
function powHints(c){
  const b=c.node.b.v,e=c.node.e;
  const h1=b.n<0?`Base negativa: si el exponente es <b>par</b> sale positivo, si es <b>impar</b> sale negativo. Aquí el exponente es ${e} (${e%2?'impar':'par'}).`:(e===0?'Cualquier número (distinto de 0) elevado a 0 vale 1.':`Multiplica la base por sí misma ${e} veces.`);
  const bb=b.d===1&&b.n>=0?qH(b):`(${qH(b)})`;
  const h2=e===0?'Resultado: 1':(b.d===1?`${Array(e).fill(bb).join(' · ')}`:`Eleva arriba y abajo: ${fR(Math.abs(b.n)+'<sup>'+e+'</sup>',b.d+'<sup>'+e+'</sup>')}`+(b.n<0?' y pon el signo.':''));
  return[h1,h2];
}
function rootHints(c){const v=c.node.e.v.n,k=Math.round(Math.sqrt(v));return[`¿Qué número multiplicado por sí mismo da ${v}?`,`Prueba: ${k-1}·${k-1} = ${(k-1)*(k-1)}. ¿Y el siguiente?`];}
function stepHints(c){return c.kind==='sum'?sumHints(c.node):c.kind==='prod'?prodHints(c):c.kind==='pow'?powHints(c):rootHints(c);}
function ruleLabel(c){
  const fr=c.kind==='sum'?sumVals(c.node).some(v=>v.d!==1):c.kind==='prod'?c.node.terms.slice(0,2).some(t=>t.n.v.d!==1):false;
  const where=c.depth>0?'Está dentro de un paréntesis, así que va primero. ':'';
  const map={sum:fr?'Suma y resta de fracciones: común denominador':'Sumas y restas: junta lo que ganas y lo que pierdes',
    prod:c.kind==='prod'&&c.node.terms[1].op===':'?(fr?'División: multiplica por la inversa':'División: ojo con los signos'):(fr?'Multiplicación de fracciones':'Multiplicación: ojo con los signos'),
    pow:'Potencia: va antes que multiplicar y sumar',root:'Raíz cuadrada: va antes que multiplicar y sumar'};
  const ico={sum:'➕',prod:'✖️',pow:'⚡',root:'√'};
  return{ico:ico[c.kind],txt:map[c.kind],where};
}
function diagnose(u,ans,c){
  if(ans.n!==0&&eqQ(u,neg(ans)))return 'El número está bien, pero <b>revisa el signo</b>.';
  if(c&&c.kind==='sum'){const v=sumVals(c.node);if(v.some(x=>x.d!==1)){const nv=v.reduce((a,x)=>a+x.n,0),dv=v.reduce((a,x)=>a+x.d,0);if(dv&&eqQ(u,Q(nv,dv)))return 'Ojo: <b>los denominadores no se suman</b>. Primero busca un denominador común.';}}
  if(c&&c.kind==='prod'&&c.node.terms[1].op===':'){const t=c.node.terms;if(eqQ(u,mul(t[0].n.v,t[1].n.v)))return 'Has multiplicado. Para dividir, <b>multiplica por la inversa</b> de la segunda.';}
  if(c&&c.kind==='pow'){const b=c.node.b.v;if(b.d===1&&eqQ(u,Q(b.n*c.node.e)))return 'Una potencia no es multiplicar la base por el exponente: es multiplicar la base <b>por sí misma</b>.';}
  if(ans.d===1&&u.d===1&&Math.abs(u.n-ans.n)<=2)return 'Estás muy cerca. Repasa la cuenta con calma.';
  return pick(['Todavía no. Mira la pista si la necesitas.','No es eso. Vuelve a mirar los signos.','Casi nadie lo saca a la primera. Prueba otra vez.']);
}

/* ===== utilidades para el asistente de denominador común ===== */

/* --- recta numérica SVG --- */
function nlSVG(min,max,marks){
  const W=560,pad=24,step=(W-2*pad)/(max-min);const x=v=>pad+(v-min)*step;let s=`<svg class="nl" viewBox="0 0 ${W} 64" role="img" aria-label="Recta numérica"><line x1="${pad-10}" y1="34" x2="${W-pad+10}" y2="34" class="ax"/>`;
  for(let v=min;v<=max;v++){const big=v===0||(max-min<=20)||v%5===0;s+=`<line x1="${x(v)}" y1="${big?27:30}" x2="${x(v)}" y2="${big?41:38}" class="tk"/>`;if(max-min<=20||v%5===0)s+=`<text x="${x(v)}" y="58" class="tl">${ns(v)}</text>`;}
  marks.forEach((m,i)=>{s+=`<circle cx="${x(m.v)}" cy="34" r="7" class="mk mk${i}"/><text x="${x(m.v)}" y="18" class="ml">${m.l??ns(m.v)}</text>`;});
  return s+'</svg>';
}
/* --- figura de fracción --- */
function gridSVG(rows,cols,k){
  const cells=shuffle([...Array(rows*cols).keys()]).slice(0,k);const sz=36;
  let s=`<svg class="fig" viewBox="0 0 ${cols*sz+4} ${rows*sz+4}" role="img" aria-label="Figura dividida en partes iguales">`;
  for(let r=0;r<rows;r++)for(let c=0;c<cols;c++){const i=r*cols+c;s+=`<rect x="${c*sz+2}" y="${r*sz+2}" width="${sz}" height="${sz}" class="${cells.includes(i)?'on':'off'}"/>`;}
  return s+'</svg>';
}
function pieSVG(n,k){
  let s=`<svg class="fig pie" viewBox="0 0 120 120" role="img" aria-label="Círculo dividido en partes iguales">`;const cx=60,cy=60,r=54;
  for(let i=0;i<n;i++){const a0=-Math.PI/2+i*2*Math.PI/n,a1=a0+2*Math.PI/n;const x0=cx+r*Math.cos(a0),y0=cy+r*Math.sin(a0),x1=cx+r*Math.cos(a1),y1=cy+r*Math.sin(a1);s+=`<path d="M${cx},${cy} L${x0.toFixed(1)},${y0.toFixed(1)} A${r},${r} 0 ${n===1?1:0} 1 ${x1.toFixed(1)},${y1.toFixed(1)} Z" class="${i<k?'on':'off'}"/>`;}
  return s+'</svg>';
}
/* --- modelo de barras (método de la barra) --- */
function barSVG(units,segs){
  const W=560,H=50,u=(W-4)/units;let s=`<svg class="bar" viewBox="0 0 ${W} ${H+30}" role="img" aria-label="Barra dividida en partes">`;let x=2;
  segs.forEach((g,gi)=>{for(let i=0;i<g.u;i++){s+=`<rect x="${(x+i*u).toFixed(1)}" y="2" width="${u.toFixed(1)}" height="${H}" class="b${gi}"/>`;}
    if(g.u>0)s+=`<text x="${(x+g.u*u/2).toFixed(1)}" y="${H+22}" class="bl">${g.l}</text>`;x+=g.u*u;});
  return s+'</svg>';
}

/* reto rápido */
function gQuick(){
  const k=pick(['s','s','m','d','of','fs','simp']);
  if(k==='s'){const a=nz(-15,15),b=nz(-15,15);const e=S([1,N(a)],[sgn(),N(b,{p:true})]);return{h:rd(e),a:ev(e)};}
  if(k==='m'){const a=nz(-9,9),b=nz(-9,9);const e=P(N(a,{p:true}),['·',N(b,{p:true})]);return{h:rd(e),a:ev(e)};}
  if(k==='d'){const b=nz(-9,9),q=nz(-9,9);const e=P(N(b*q,{p:true}),[':',N(b,{p:true})]);return{h:rd(e),a:ev(e)};}
  if(k==='of'){const b=pick([2,3,4,5,10]),a=coprime(b),n=b*R(2,10);return{h:`${fH(a,b)} de ${n}`,a:Q(a*n/b)};}
  if(k==='fs'){const d=pick([3,5,7,9,11]);const a=R(1,d-1),b=R(1,d-1);const e=S([1,Nq(a,d)],[1,Nq(b,d)]);return{h:rd(e),a:ev(e)};}
  const p=R(1,7),q=R(2,9);const m=pick([2,3,4,5]);if(gcd(p,q)!==1)return gQuick();return{h:`Simplifica ${fH(p*m,q*m)}`,a:Q(p,q),hard:true};
}

  if(ok){o.frequency.setValueAtTime(660,t);o.frequency.setValueAtTime(880,t+.09);}else{o.frequency.setValueAtTime(220,t);o.frequency.setValueAtTime(180,t+.1);}
  g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.18,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.25);o.start(t);o.stop(t+.26);}catch(e){}}

let SESS=null,CUR=null,KB=null;
function buildQueue(l){
  const st=(ST.lessons[l.id]||{}).stars||0;
  const lv=l.boss?[1,1,1,2,2,2,2,2]:st>=2?[1,1,2,2,2,2]:[0,0,1,1,1,2];
  const n=l.n;const levels=Array.from({length:n},(_,i)=>lv[Math.floor(i*lv.length/n)]);
  return levels.map(L=>{const src=l.boss?LBY[pick(l.mix)]:l;let e;for(let g=0;g<5;g++){try{e=src.gen(L);if(e)break;}catch(err){console.error(err);}}e.L=L;e.src=src.id;return e;});
}
function vPractice(o){

  else{const l=LBY[o.id];SESS={id:o.id,queue:buildQueue(l),i:0,clean:0,xp:0,combo:0,maxCombo:0,fails:0};}

}

   <section class="excard" id="exc"></section>
   <div class="dock"><div id="fb" class="fbline" aria-live="polite"></div><section id="pad"></section></div></main>`;
  $('#quit').onclick=()=>{const m=modal(`<h2 class="hand">¿Salir de la lección?</h2><p>Perderás el progreso de esta lección (la XP ganada se queda).</p><div class="row"><button class="btn" data-close>Seguir aquí</button><button class="btn warn" id="qy">Salir</button></div>`);m.el.querySelector('#qy').onclick=()=>{m.close();go('home');};};
  ({input:drawInput,mc:drawMC,order:drawOrder,steps:drawSteps,multi:drawMulti})[ex.type]();

/* --- pistas --- */
function hintBox(hints,extra=''){if(!hints||!hints.length)return extra;return `<div class="hints">${hints.slice(0,CUR.hint).map((h,i)=>`<div class="hint"><span class="hn">Pista ${i+1}</span>${h}</div>`).join('')}</div><div class="hrow">${CUR.hint<hints.length?`<button class="btn sm" id="hb">💡 ${CUR.hint?'Otra pista':'Pista'}</button>`:''}${extra}</div>`;}
function bindHint(hints,redraw){const b=$('#hb');if(b)b.onclick=()=>{CUR.hint=Math.min(hints.length,CUR.hint+1);CUR.used=true;redraw();};}
/* --- teclado numérico --- */
function padH(o={}){return `<div class="ansbox ${o.small?'small':''}"><div class="ans" id="ans" aria-live="polite"></div>${o.unit?`<span class="unit">${o.unit}</span>`:''}</div>
  <div class="keys">${['7','8','9','del','4','5','6','neg','1','2','3','frac'].map(k=>{const lab={del:'⌫',neg:'±',frac:'a/b'}[k]||k;const dis=k==='frac'&&o.intOnly;return `<button class="k ${/\d/.test(k)?'':'fn'}" data-k="${k}" ${dis?'disabled':''} aria-label="${{del:'Borrar',neg:'Cambiar signo',frac:'Fracción'}[k]||k}">${lab}</button>`;}).join('')}
  <button class="k" data-k="0">0</button><button class="k ok" data-k="ok">Comprobar</button></div>`;}
function bindPad(onOk,intOnly){KB={onOk,intOnly};$('#pad').querySelectorAll('[data-k]').forEach(b=>b.onclick=()=>pressKey(b.dataset.k));drawAns();}
function pressKey(k){if(!KB||CUR&&CUR.done&&VIEW==='practice')return;let s=CUR.input;
  if(/^\d$/.test(k)){if(s.replace(/[^\d]/g,'').length<10)s+=k;}
  else if(k==='del')s=s.slice(0,-1);
  else if(k==='neg')s=s.startsWith('-')?s.slice(1):'-'+s;
  else if(k==='frac'){if(!(LCD?LCD.stage!=='simp':KB.intOnly)&&!s.includes('/')&&/\d$/.test(s))s+='/';}
  else if(k==='ok'){(LCD?lcdCheck:KB.onOk)();return;}
  CUR.input=s;drawAns();}
function drawAns(){const a=$('#ans');if(!a)return;const s=CUR.input;if(!s){a.innerHTML='<span class="ph">?</span>';return;}
  const ng=s.startsWith('-');const b=ng?s.slice(1):s;let h;
  if(b.includes('/')){const[n,d]=b.split('/');h=`<span class="fr"><span>${n||'&nbsp;'}</span><span>${d||'<i class="cur"></i>'}</span></span>`;}else h=b||'<i class="cur"></i>';
  a.innerHTML=`<span class="num">${ng?M:''}${h}</span>`;}
document.addEventListener('keydown',e=>{if(!KB||document.querySelector('.modal'))return;if(e.target.tagName==='INPUT')return;
  if(/^\d$/.test(e.key))pressKey(e.key);else if(e.key==='Backspace'){e.preventDefault();pressKey('del');}else if(e.key==='-')pressKey('neg');else if(e.key==='/')pressKey('frac');else if(e.key==='Enter'){e.preventDefault();pressKey('ok');}});
function parseIn(s){const m=s.match(/^(-?)(\d+)(?:\/(\d+))?$/);if(!m)return null;const d=m[3]?+m[3]:1;if(d===0)return null;return Q((m[1]?-1:1)*(+m[2]),d);}
function shake(){const a=$('#exc');if(a){a.classList.remove('shk');void a.offsetWidth;a.classList.add('shk');}}
function fbMsg(h,cls=''){const f=$('#fb');if(f){f.className='fbline '+cls;f.innerHTML=h;}}
/* --- comprobar respuesta numérica --- */
function judgeIn(target,reduce){const u=parseIn(CUR.input);if(!u){fbMsg('Escribe un número (usa a/b para fracciones).','warn');return{st:'bad'};}
  if(!eqQ(u,target))return{st:'wrong',u};if(reduce&&!isRed(u))return{st:'reduce',u};if(!reduce&&!isRed(u))return{st:'okred',u};return{st:'ok',u};}
/* --- fin de ejercicio --- */
function finishEx(ok,solH){
  CUR.done=true;KB=null;const clean=ok&&!CUR.failed&&!CUR.used;const ex=CUR.ex;
  let xp=0;if(ok){xp=clean?10:5;if(ex.type==='steps')xp+=2*(CUR.lines.length);if(ex.type==='multi')xp+=3*ex.parts.length;}
  if(clean){SESS.combo++;SESS.clean++;if(SESS.combo>=3)xp+=2;}else SESS.combo=0;
  SESS.maxCombo=Math.max(SESS.maxCombo,SESS.combo);ST.stats.maxCombo=Math.max(ST.stats.maxCombo,SESS.combo);
  ST.stats.tot++;if(clean)ST.stats.ok++;if(ok&&ex.type==='steps')ST.stats.longs++;if(ok&&ex.type==='multi')ST.stats.probs++;
  if(!clean){SESS.fails++;if(!SESS.review){const key=JSON.stringify(ex);if(!ST.mistakes.some(m=>m.k===key)){ST.mistakes.unshift({k:key,src:ex.src});ST.mistakes=ST.mistakes.slice(0,40);}}}
  if(SESS.review&&clean){ST.mistakes=ST.mistakes.filter(m=>m.k!==ex._key);ST.stats.reviewOk++;}
  if(xp)gainXP(xp);SESS.xp+=xp;save();
  beep(ok);
  const head=ok?(clean?pick(GOOD):'¡Conseguido!'):'Esta vez no ha salido';
  const sub=ok?(clean?(SESS.combo>=3?`${SESS.combo} seguidas 🔥`:''):'Lo guardo en tu repaso para que lo practiques otra vez.'):pick(GROW)+' Lo guardo en tu repaso.';
  const pad=$('#pad');pad.innerHTML=`<div class="panel ${ok?'good':'bad'}"><div class="ph1"><b>${head}</b>${xp?`<span class="xp">+${xp} XP</span>`:''}</div>${sub?`<p>${sub}</p>`:''}
   ${solH?`<details ${ok?'':'open'}><summary>${ok?'Ver cómo se hace':'Así se resuelve'}</summary><div class="solbox">${solH}</div></details>`:''}<button class="btn pri wide" id="cont">Continuar</button></div>`;
  $('#cont').onclick=nextEx;setTimeout(()=>{const c=$('#cont');if(c)c.focus();},60);
  if(ok&&clean&&SESS.combo>0&&SESS.combo%5===0)confetti();
}
function nextEx(){SESS.i++;if(SESS.i>=SESS.queue.length)go('result');else startEx();}

/* --- tipo: respuesta numérica --- */
function drawInput(){
  const ex=CUR.ex;
  $('#exc').innerHTML=`<p class="prompt">${ex.prompt}</p>${ex.exprHTML?`<div class="mline big2">${ex.exprHTML}</div>`:''}${hintBox(ex.hints)}`;

}
function checkInput(){
  const ex=CUR.ex;const r=judgeIn(ex.ans,ex.reduce);if(r.st==='bad')return;
  if(r.st==='reduce'){fbMsg('¡El valor es correcto! Pero hay que <b>simplificarlo</b> hasta la fracción irreducible.','warn');return;}
  if(r.st==='ok'||r.st==='okred'){finishEx(true,ex.sol);if(r.st==='okred')fbMsg(`Correcto. Simplificado sería ${qH(red(r.u))}.`,'good');return;}
  CUR.tries++;CUR.failed=true;shake();beep(false);
  if(CUR.tries>=3){fbMsg(`La respuesta era <b>${qH(red(ex.ans))}</b>.`,'bad');finishEx(false,ex.sol||qH(ex.ans));return;}
  fbMsg(diagnose(r.u,ex.ans,ex.diagC)+` <span class="muted">(intento ${CUR.tries} de 3)</span>`,'bad');CUR.input='';drawAns();
}
/* --- tipo: opción múltiple --- */
function drawMC(){
  const ex=CUR.ex;CUR.wrong=CUR.wrong||[];
  $('#exc').innerHTML=`<p class="prompt">${ex.prompt}</p><div class="opts ${ex.opts.every(o=>o.length<12)?'inline':''}">${ex.opts.map((o,i)=>`<button class="opt ${CUR.wrong.includes(i)?'no':''}" data-i="${i}" ${CUR.wrong.includes(i)?'disabled':''}>${o}</button>`).join('')}</div>${hintBox(ex.hints)}`;
  bindHint(ex.hints,drawMC);
  $('#exc').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{if(CUR.done)return;const i=+b.dataset.i;
    if(i===ex.ok){b.classList.add('yes');finishEx(true,ex.sol);}
    else{CUR.wrong.push(i);CUR.tries++;CUR.failed=true;beep(false);shake();if(CUR.tries>=2||ex.opts.length-CUR.wrong.length<=1){drawMC();$('#exc').querySelectorAll('.opt')[ex.ok].classList.add('yes');finishEx(false,ex.sol);}else{drawMC();fbMsg('Esa no es. '+(ex.hints[0]&&!CUR.hint?'Mira la pista si te ayuda.':'Prueba otra.'),'bad');}}});
}
/* --- tipo: ordenar --- */
function drawOrder(){
  const ex=CUR.ex;const sel=CUR.sel;
  $('#exc').innerHTML=`<p class="prompt">${ex.prompt}</p><div class="slots">${ex.items.map((_,i)=>`<button class="slot ${sel[i]!==undefined?'full':''}" data-s="${i}">${sel[i]!==undefined?ex.items[sel[i]].h:i+1}</button>`).join('<span class="lt">&lt;</span>')}</div>
   <div class="chips">${ex.items.map((it,i)=>`<button class="chipn ${sel.includes(i)?'used':''}" data-c="${i}" ${sel.includes(i)?'disabled':''}>${it.h}</button>`).join('')}</div>${hintBox(ex.hints)}`;
  bindHint(ex.hints,drawOrder);

  $('#exc').querySelectorAll('[data-s]').forEach(b=>b.onclick=()=>{if(CUR.done)return;const i=+b.dataset.s;if(sel[i]!==undefined){sel.splice(i);drawOrder();}});
  if(!$('#pad').innerHTML||!$('#ordok')){$('#pad').innerHTML=`<div class="row"><button class="btn" id="ordclr">Borrar</button><button class="btn pri" id="ordok">Comprobar</button></div>`;
    $('#ordclr').onclick=()=>{CUR.sel=[];drawOrder();};$('#ordok').onclick=checkOrder;}
}
function checkOrder(){const ex=CUR.ex;if(CUR.sel.length<ex.items.length){fbMsg('Coloca todos los números antes de comprobar.','warn');return;}
  const vals=CUR.sel.map(i=>ex.items[i].v);const ok=vals.every((v,i)=>i===0||vals[i-1]<=v);
  if(ok){finishEx(true,ex.sol);return;}
  CUR.tries++;CUR.failed=true;shake();beep(false);
  if(CUR.tries>=2){finishEx(false,ex.sol);return;}
  const bad=vals.findIndex((v,i)=>i>0&&vals[i-1]>v);fbMsg(`Revisa la posición ${bad}–${bad+1}: ${ex.items[CUR.sel[bad-1]].h} no es menor que ${ex.items[CUR.sel[bad]].h}.`,'bad');CUR.sel=[];drawOrder();}

/* --- tipo: operación larga paso a paso --- */
function drawSteps(){
  const ex=CUR.ex;
  if(!CUR.guided){
    $('#exc').innerHTML=`<p class="prompt">Reto: resuélvelo en tu cuaderno y escribe solo el <b>resultado final</b> (simplificado).</p><div class="mline big2">${rd(CUR.ast)}</div><div class="hrow"><button class="btn sm" id="toG">🪜 Hacerlo paso a paso</button></div>`;

    if(!$('#pad').innerHTML){$('#pad').innerHTML=padH({intOnly:!hasFrac(ex.ast)&&ev(ex.ast).d===1});bindPad(checkFinal,!hasFrac(ex.ast)&&ev(ex.ast).d===1);}
    return;
  }
  const c=best(CUR.ast);CUR.cand=c;const rl=ruleLabel(c);const hints=stepHints(c);
  const wantLCD=needsLCD(c)&&CUR.skipSub!==c.node.id;
  if(wantLCD&&!LCD&&(ST.lcdHelp||CUR.forceSub===c.node.id)){lcdStart(sumVals(c.node),c.node.id,(res,info)=>lcdStepDone(c,res,info),true);return;}
  if(LCD&&LCD.cid===c.node.id){
    $('#exc').innerHTML=`<p class="prompt">${ex.prompt}</p><div class="notebook">${CUR.lines.map((l,i)=>`<div class="nl2 past">${i?'<span class="eq">=</span>':''}${l}</div>`).join('')}<div class="nl2 now">${CUR.lines.length?'<span class="eq">=</span>':''}${rd(CUR.ast,'top',hlOf(c))}</div></div><div id="lcd"></div>`;
    if(!$('#pad').innerHTML){$('#pad').innerHTML=padH({small:true});bindPad(checkStep,false);}
    lcdDraw();const nb=$('.notebook');if(nb)nb.scrollTop=nb.scrollHeight;return;}
  $('#exc').innerHTML=`<p class="prompt">${ex.prompt}</p>
   <div class="notebook">${CUR.lines.map((l,i)=>`<div class="nl2 past">${i?'<span class="eq">=</span>':''}${l}</div>`).join('')}<div class="nl2 now">${CUR.lines.length?'<span class="eq">=</span>':''}${rd(CUR.ast,'top',hlOf(c))}</div></div>
   <div class="rule"><span class="ri" aria-hidden="true">${rl.ico}</span><span><b>Paso ${CUR.lines.length+1}:</b> calcula lo marcado. ${rl.where}<br><small>${rl.txt}</small></span></div>${hintBox(hints,needsLCD(c)?'<button class="btn sm" id="toLCD">🧮 Desglosar: m.c.m. y convertir</button>':'')}`;
  bindHint(hints,()=>{drawSteps();});
  const tl=$('#toLCD');if(tl)tl.onclick=()=>{CUR.forceSub=c.node.id;CUR.skipSub=null;drawSteps();};
  {const fk=$('#pad [data-k="frac"]');if(fk)fk.disabled=false;}
  if(!$('#pad').innerHTML){$('#pad').innerHTML=padH({small:true});bindPad(checkStep,false);}
  const nb=$('.notebook');if(nb)nb.scrollTop=nb.scrollHeight;

function checkStep(){
  const c=CUR.cand;const target=stepVal(c);const r=judgeIn(target,false);if(r.st==='bad')return;
  if(r.st==='wrong'){CUR.stepTries++;CUR.failed=true;shake();beep(false);
    if(CUR.stepTries>=3){fbMsg(`Lo marcado vale <b>${qH(target)}</b>. Sigamos.`,'bad');advanceStep(c);return;}
    fbMsg(diagnose(r.u,target,c)+` <span class="muted">(intento ${CUR.stepTries} de 3)</span>`,'bad');CUR.input='';drawAns();return;}
  fbMsg(r.st==='okred'?`✓ Bien. Simplificado: ${qH(target)}`:'✓ '+pick(['Bien','Correcto','Eso es','Perfecto']),'good');
  advanceStep(c);
}
function advanceStep(c){
  CUR.lines.push(rd(CUR.ast,'top',hlOf(c)));CUR.ast=apply(CUR.ast,c);CUR.stepTries=0;CUR.hint=0;CUR.input='';ST.stats.steps++;
  if(CUR.ast.t==='n'){CUR.lines.push(rd(CUR.ast));$('#exc').innerHTML=`<p class="prompt">Resultado:</p><div class="notebook">${CUR.lines.map((l,i)=>`<div class="nl2 ${i===CUR.lines.length-1?'res':'past'}">${i?'<span class="eq">=</span>':''}${l}</div>`).join('')}</div>`;{const nb=$('.notebook');if(nb)nb.scrollTop=nb.scrollHeight;}finishEx(true,null);return;}
  drawSteps();drawAns();
}
function checkFinal(){
  const ex=CUR.ex;const ans=ev(ex.ast);const r=judgeIn(ans,true);if(r.st==='bad')return;
  if(r.st==='reduce'){fbMsg('El valor es correcto, pero <b>simplifícalo</b>.','warn');return;}
  if(r.st==='ok'){finishEx(true,solHTML(ex.ast));return;}
  CUR.tries++;CUR.failed=true;shake();beep(false);
  if(CUR.tries>=3){fbMsg(`El resultado era <b>${qH(ans)}</b>.`,'bad');finishEx(false,solHTML(ex.ast));return;}
  fbMsg(diagnose(r.u,ans,null)+(CUR.tries>=2?' ¿Lo hacemos paso a paso? Pulsa 🪜.':'')+` <span class="muted">(intento ${CUR.tries} de 3)</span>`,'bad');CUR.input='';drawAns();
}

/* --- tipo: problema por pasos --- */
function drawMulti(){
  const ex=CUR.ex;const p=ex.parts[CUR.pi];if(!p||CUR.done)return;
  $('#exc').innerHTML=`<div class="story">${ex.story}</div>${ex.data&&ex.data.length?`<div class="data"><b>Datos</b>${ex.data.map(d=>`<span>${d}</span>`).join('')}</div>`:''}
   ${ex.bar?`<button class="btn sm" id="barb">📊 ${CUR.showBar?'Ocultar dibujo':'Dibújalo'}</button>${CUR.showBar?`<div class="figwrap">${ex.bar}</div>`:''}`:''}
   <ol class="parts">${ex.parts.slice(0,CUR.pi).map(q=>`<li class="pdone"><span>${q.q}</span><b>${q.type==='mc'?q.opts[q.ok]:qH(red(q.ans))+(q.unit?' '+q.unit:'')}</b></li>`).join('')}
   <li class="pnow"><span>${p.q}</span>${p.type==='mc'?`<div class="opts">${p.opts.map((o,i)=>`<button class="opt ${(CUR.wrong||[]).includes(i)?'no':''}" data-i="${i}" ${(CUR.wrong||[]).includes(i)?'disabled':''}>${o}</button>`).join('')}</div>`:''}</li></ol>
   ${LCD?'<div id="lcd"></div>':''}
   ${ex.parts.length>1?`<p class="muted small">Paso ${CUR.pi+1} de ${ex.parts.length}</p>`:''}${LCD?'':hintBox(p.hints,p.sum?'<button class="btn sm" id="toLCD">🧮 Ayuda: denominador común</button>':'')}`;
  bindHint(p.hints,drawMulti);
  const tl=$('#toLCD');if(tl)tl.onclick=()=>{lcdStart(p.sum.map(x=>x),'part'+CUR.pi,(res,info)=>{LCD=null;if(eqQ(res,p.ans)){if(info.failed)CUR.failed=true;CUR.used=CUR.used||info.failed;partDone(true);}else drawMulti();},false);};
  const bb=$('#barb');if(bb)bb.onclick=()=>{CUR.showBar=!CUR.showBar;drawMulti();};
  if(p.type==='mc'){$('#pad').innerHTML='';KB=null;$('#exc').querySelectorAll('.opt').forEach(b=>b.onclick=()=>{const i=+b.dataset.i;if(i===p.ok)partDone(true);else{CUR.wrong=CUR.wrong||[];CUR.wrong.push(i);CUR.partFails++;CUR.failed=true;shake();beep(false);if(CUR.partFails>=2){fbMsg('La correcta era la marcada en verde.','bad');partDone(false);}else{drawMulti();fbMsg('No es esa. Revisa la pista.','bad');}}});}
  else if(!$('#ans')){$('#pad').innerHTML=padH({intOnly:p.intOnly,unit:p.unit});bindPad(checkPart,p.intOnly);}
  else{KB={onOk:checkPart,intOnly:p.intOnly};const fk=$('#pad [data-k="frac"]');if(fk)fk.disabled=!!p.intOnly;const un=$('#pad .unit');if(un)un.textContent=p.unit||'';else if(p.unit)$('#pad .ansbox').insertAdjacentHTML('beforeend',`<span class="unit">${p.unit}</span>`);}
  if(LCD)lcdDraw();
}
function checkPart(){
  const p=CUR.ex.parts[CUR.pi];if(!p||CUR.done||CUR.wait)return;const r=judgeIn(p.ans,p.reduce);if(r.st==='bad')return;
  if(r.st==='reduce'){fbMsg('Valor correcto, pero <b>simplifícalo</b>.','warn');return;}
  if(r.st==='wrong'){CUR.partFails++;CUR.failed=true;shake();beep(false);if(CUR.partFails>=3){fbMsg(`Era <b>${qH(red(p.ans))}</b>. ${p.sol?'('+p.sol+')':''}`,'bad');partDone(false);return;}
    fbMsg(diagnose(r.u,p.ans,null)+` <span class="muted">(intento ${CUR.partFails} de 3)</span>`,'bad');CUR.input='';drawAns();return;}
  partDone(true);
}
function partDone(ok){
  const ex=CUR.ex;const p=ex.parts[CUR.pi];if(ok){fbMsg('✓ '+(p.sol||'Bien'),'good');beep(true);}
  CUR.pi++;CUR.partFails=0;CUR.hint=0;CUR.input='';CUR.wrong=[];
  if(CUR.pi>=ex.parts.length){const solH=`<ol class="parts">${ex.parts.map(q=>`<li class="pdone"><span>${q.q}</span><b>${q.sol||qH(q.ans)}</b></li>`).join('')}</ol>`;drawMultiFinal();finishEx(true,solH);return;}
  CUR.wait=true;setTimeout(()=>{CUR.wait=false;if(!CUR.done&&CUR.ex.parts[CUR.pi]){drawMulti();drawAns();}},ok?450:900);
}
function drawMultiFinal(){const ex=CUR.ex;$('#exc').innerHTML=`<div class="story">${ex.story}</div><ol class="parts">${ex.parts.map(q=>`<li class="pdone"><span>${q.q}</span><b>${q.type==='mc'?q.opts[q.ok]:qH(red(q.ans))+(q.unit?' '+q.unit:'')}</b></li>`).join('')}</ol>`;}

/* ================== ASISTENTE DE DENOMINADOR COMÚN ================== */
let LCD=null;
function lcdStart(vals,cid,onDone,inSteps){
  const dens=uniq(vals.map(v=>v.d).filter(d=>d>1)).sort((x,y)=>x-y);
  LCD={vals,cid,onDone,inSteps,dens,L:lcmA(vals.map(v=>v.d)),stage:'mcm',ci:0,conv:[],S:null,g:1,tries:0,hint:0,failed:false,note:''};
  CUR.input='';fbMsg('');
  if(inSteps)drawSteps();else drawMulti();
  drawAns();
}
function lcdHints(){
  const C=LCD,L=C.L;
  if(C.stage==='mcm'){const mx=C.dens[C.dens.length-1];
    return['Busca el número más pequeño que esté en la tabla de multiplicar de <b>todos</b> los denominadores.'+(C.vals.some(v=>v.d===1)?' Los números enteros tienen denominador 1, así que no cuentan.':''),
      `<table class="rej">${C.dens.map(d=>`<tr><th>Tabla del ${d}</th><td class="l">${multList(d,d===mx?L:Math.min(L,d*8),L)}${d!==mx&&L>d*8?', …':''}</td></tr>`).join('')}</table>`,
      `Con factores primos: ${C.dens.map(d=>`${d} = ${factStr(d)}`).join(' &nbsp; ')}. Coge cada factor con su mayor exponente: m.c.m. = ${factStr(L)}.`];}
  if(C.stage==='conv'){const v=C.vals[C.ci];const k=L/v.d;
    return v.d===1?[`Un entero es una fracción con denominador 1: ${Math.abs(v.n)} = ${fR(Math.abs(v.n),1)}. ¿Por cuánto multiplico 1 para llegar a ${L}?`,`1 · ${L} = ${L}, así que arriba también: ${Math.abs(v.n)} · ${L}.`]
      :[`¿Por cuánto multiplico ${v.d} para llegar a ${L}? Haz ${L} : ${v.d}.`,`${L} : ${v.d} = <b>${k}</b>. Lo que haces abajo, lo haces arriba: ${Math.abs(v.n)} · ${k}.`];}
  if(C.stage==='sum'){const p=C.conv.filter(x=>x>0),n=C.conv.filter(x=>x<0).map(x=>-x);
    return[`Ya tienen todas el mismo denominador (${L}). Ahora solo se operan los <b>numeradores</b>; el ${L} se queda abajo.`,
      tbl([['Gano (+)',(p.join(' + ')||'0')+' = <b>'+p.reduce((x,y)=>x+y,0)+'</b>'],['Pierdo (−)',(n.join(' + ')||'0')+' = <b>'+n.reduce((x,y)=>x+y,0)+'</b>']])];}
  if(C.stage==='mcd'){const a=Math.abs(C.S);const da=divisors(a),dl=divisors(L);
    return['El m.c.d. es el número <b>más grande</b> que divide a los dos.',`<table class="rej"><tr><th>Divisores de ${a}</th><td class="l">${da.map(x=>dl.includes(x)?`<span class="hit">${x}</span>`:x).join(', ')}</td></tr><tr><th>Divisores de ${L}</th><td class="l">${dl.map(x=>da.includes(x)?`<span class="hit">${x}</span>`:x).join(', ')}</td></tr></table>Los marcados son comunes: ¿cuál es el mayor?`];}
  return[`Divide el numerador y el denominador entre ${C.g}.`,`${fR(Math.abs(C.S)+' : '+C.g,L+' : '+C.g)}${C.S<0?' (y el signo − se queda)':''}`];
}
function lcdDraw(){
  const C=LCD;const box=$('#lcd');if(!box)return;const L=C.L;const order=['mcm','conv','sum','mcd','simp'];const si=order.indexOf(C.stage);
  const q='<span class="qbox">?</span>';
  let h=`<div class="lcd"><div class="lcdh"><span>🧮 Denominador común</span><small>${['Paso 1 de 4: m.c.m.','Paso 2 de 4: convertir','Paso 3 de 4: operar','Paso 4 de 4: simplificar','Paso 4 de 4: simplificar'][si]}</small></div>`;
  h+=`<div class="lrow ${si===0?'now':'done'}"><span>m.c.m.(${C.dens.join(', ')}) =</span>${si===0?q:`<b class="okv">${L}</b>`}</div>`;
  if(si>=1)C.vals.forEach((v,i)=>{const sg=v.n<0?M:'';const doneV=i<C.conv.length;const now=si===1&&i===C.ci;if(si===1&&i>C.ci)return;
    h+=`<div class="lrow ${now?'now':'done'}"><span class="num">${sg}${v.d===1?Math.abs(v.n):fR(Math.abs(v.n),v.d)}</span><span>=</span><span class="num">${sg}<span class="fr"><span>${doneV?`<b class="okv">${Math.abs(C.conv[i])}</b>`:q}</span><span>${L}</span></span></span>${now&&v.n<0?'<small class="muted">el signo se queda igual</small>':''}</div>`;});
  if(si>=2){h+=`<div class="lrow ${si===2?'now':'done'}"><span class="num">${fR(numsExpr(C.conv),L)}</span><span>=</span><span class="num">${si===2?`<span class="fr"><span>${q}</span><span>${L}</span></span>`:qH(Q(C.S,L))}</span></div>`;}
  if(si>=3){h+=`<div class="lrow ${si===3?'now':'done'}"><span>m.c.d.(${Math.abs(C.S)}, ${L}) =</span>${si===3?q:`<b class="okv">${C.g}</b>`}</div>`;}
  if(si>=4){h+=`<div class="lrow now"><span class="num">${qH(Q(C.S,L))}</span><span>=</span>${q}<small class="muted">fracción irreducible</small></div>`;}
  const hs=lcdHints();
  h+=`<div class="hints">${hs.slice(0,C.hint).map((x,i)=>`<div class="hint"><span class="hn">Pista ${i+1}</span>${x}</div>`).join('')}</div><div class="hrow">${C.hint<hs.length?`<button class="btn sm" id="lhb">💡 ${C.hint?'Otra pista':'Pista'}</button>`:''}${C.inSteps?'<button class="btn sm ghost" id="lskip">⏩ Ya lo sé: pongo el resultado</button>':'<button class="btn sm ghost" id="lskip">Cerrar ayuda</button>'}</div></div>`;
  box.innerHTML=h;
  const hb=$('#lhb');if(hb)hb.onclick=()=>{C.hint++;CUR.used=true;lcdDraw();};
  $('#lskip').onclick=()=>{const cid=C.cid;const inS=C.inSteps;LCD=null;CUR.input='';if(inS){CUR.skipSub=cid;CUR.forceSub=null;drawSteps();}else drawMulti();drawAns();};
  const fk=$('#pad [data-k="frac"]');if(fk)fk.disabled=C.stage!=='simp';
  ensureVisible(C.hint?box.querySelector('.hint:last-child'):box.querySelector('.lrow.now'));
}
function lcdNext(msg){const C=LCD;C.tries=0;C.hint=0;CUR.input='';fbMsg('✓ '+msg,'good');beep(true);
  if(C.stage==='mcm'){C.stage='conv';C.ci=0;}
  else if(C.stage==='conv'){C.ci++;if(C.ci>=C.vals.length)C.stage='sum';}
  else if(C.stage==='sum'){C.g=gcd(Math.abs(C.S),C.L)||C.L;if(C.S===0){return lcdFinish(Q(0),'El resultado es 0.');}if(C.g>1)C.stage='mcd';else return lcdFinish(Q(C.S,C.L),`m.c.d.(${Math.abs(C.S)}, ${C.L}) = 1: ya es irreducible.`);}
  else if(C.stage==='mcd'){C.stage='simp';}
  else if(C.stage==='simp'){return lcdFinish(red(Q(C.S,C.L)),msg);}
  lcdDraw();drawAns();
}
function lcdFinish(res,msg){const C=LCD;fbMsg('✓ '+msg,'good');C.onDone(res,{L:C.L,conv:C.conv,S:C.S,g:C.g,failed:C.failed});}
function lcdFail(target,txt){const C=LCD;C.tries++;C.failed=true;shake();beep(false);
  if(C.tries>=3){fbMsg(`Era <b>${txt}</b>. Sigamos.`,'bad');return true;}
  return false;}
function lcdCheck(){
  const C=LCD;const s=CUR.input;const u=parseIn(s);if(!u){fbMsg('Escribe un número.','warn');return;}
  const tryMsg=()=>` <span class="muted">(intento ${C.tries} de 3)</span>`;
  if(C.stage==='mcm'){const n=u.n/u.d;
    if(u.d===1&&n===C.L)return lcdNext(`m.c.m. = ${C.L}`);
    if(u.d===1&&n>0&&C.dens.every(d=>n%d===0)){fbMsg(`${n} es múltiplo de todos, pero hay uno <b>más pequeño</b>. Con el más pequeño las cuentas son más fáciles.`,'warn');CUR.input='';drawAns();return;}
    if(lcdFail(C.L,C.L))return lcdNext(`m.c.m. = ${C.L}`);
    fbMsg(`${n} no está en la tabla de ${C.dens.filter(d=>n%d!==0).join(' ni del ')}.`+tryMsg(),'bad');CUR.input='';drawAns();return;}
  if(C.stage==='conv'){const v=C.vals[C.ci];const ans=Math.abs(v.n)*C.L/v.d;
    if(u.d===1&&Math.abs(u.n)===ans){C.conv.push(v.n<0?-ans:ans);return lcdNext(`${v.d===1?Math.abs(v.n):Math.abs(v.n)+'/'+v.d} = ${ans}/${C.L}`);}
    if(lcdFail(ans,ans)){C.conv.push(v.n<0?-ans:ans);return lcdNext('Convertida');}
    const k=C.L/v.d;fbMsg((u.d===1&&(u.n===Math.abs(v.n)+k||u.n===Math.abs(v.n)+C.L-v.d)?`Has <b>sumado</b>. Hay que <b>multiplicar</b>: ${Math.abs(v.n)} · ${k}.`:`Recuerda: ${C.L} : ${v.d} = ${k}. Multiplica el numerador por ${k}.`)+tryMsg(),'bad');CUR.input='';drawAns();return;}
  if(C.stage==='sum'){const S=C.conv.reduce((x,y)=>x+y,0);
    if(u.d===1&&u.n===S){C.S=S;return lcdNext(`${numsExpr(C.conv)} = ${ns(S)}`);}
    if(u.d!==1&&eqQ(u,Q(S,C.L))){C.S=S;return lcdNext(`Resultado ${qT(Q(S,C.L))}`);}
    if(lcdFail(S,ns(S))){C.S=S;return lcdNext('Seguimos');}
    fbMsg((u.d===1&&u.n===-S?'El número está bien, pero <b>revisa el signo</b>.':'Opera solo los numeradores: junta lo que sumas y lo que restas.')+' Escribe solo el numerador.'+tryMsg(),'bad');CUR.input='';drawAns();return;}
  if(C.stage==='mcd'){const n=u.n;
    if(u.d===1&&n===C.g)return lcdNext(`m.c.d. = ${C.g}`);
    if(u.d===1&&n>1&&Math.abs(C.S)%n===0&&C.L%n===0){fbMsg(`${n} divide a los dos, pero hay uno <b>más grande</b>.`,'warn');CUR.input='';drawAns();return;}
    if(lcdFail(C.g,C.g))return lcdNext(`m.c.d. = ${C.g}`);
    fbMsg(`${n} no divide a ${Math.abs(C.S)} y a ${C.L} a la vez.`+tryMsg(),'bad');CUR.input='';drawAns();return;}
  const t=red(Q(C.S,C.L));
  if(eqQ(u,t)&&isRed(u))return lcdNext(`Simplificada: ${qT(t)}`);
  if(eqQ(u,t)){fbMsg('Vas bien, pero todavía se puede simplificar más.','warn');CUR.input='';drawAns();return;}
  if(lcdFail(t,qT(t)))return lcdNext('Simplificada');
  fbMsg((eqQ(u,neg(t))?'Revisa el signo.':`Divide arriba y abajo entre ${C.g}.`)+tryMsg(),'bad');CUR.input='';drawAns();
}
function lcdStepDone(c,res,info){
  const L=info.L;LCD=null;
  const eqNode=S(...c.node.terms.map(t=>[t.s,N(Q(t.n.v.n*L/t.n.v.d,L))]));
  const hNode={t:'h',id:uid(),html:`<span class="num">${fR(numsExpr(info.conv),L)}</span>`};
  CUR.lines.push(rd(CUR.ast,'top',hlOf(c)));
  CUR.lines.push(rd(subst(CUR.ast,c.node.id,eqNode),'top',{id:eqNode.id}));
  const hAst=subst(CUR.ast,c.node.id,hNode);
  if(info.g>1&&info.S!==0){CUR.lines.push(rd(hAst,'top',{id:hNode.id}));const rawN=N(Q(info.S,L));CUR.ast=subst(CUR.ast,c.node.id,rawN);CUR.ast=norm(CUR.ast);
CUR.lines.push(rd(CUR.ast,'top',{id:rawN.id}));CUR.ast=norm(subst(CUR.ast,rawN.id,N(res)));}
  else{CUR.ast=norm(subst(CUR.ast,c.node.id,hNode));CUR.ast=norm(subst(CUR.ast,hNode.id,N(res)));CUR.lines.push(rd(hAst,'top',{id:hNode.id}));}
  if(info.failed)CUR.failed=true;
  CUR.stepTries=0;CUR.hint=0;CUR.input='';ST.stats.steps++;
  if(CUR.ast.t==='n'){CUR.lines.push(rd(CUR.ast));$('#exc').innerHTML=`<p class="prompt">Resultado:</p><div class="notebook">${CUR.lines.map((l,i)=>`<div class="nl2 ${i===CUR.lines.length-1?'res':'past'}">${i?'<span class="eq">=</span>':''}${l}</div>`).join('')}</div>`;{const nb=$('.notebook');if(nb)nb.scrollTop=nb.scrollHeight;}finishEx(true,null);return;}
  setTimeout(()=>{drawSteps();drawAns();},500);
}
